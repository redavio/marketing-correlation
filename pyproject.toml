[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marketing-correlation"
version = "1.0.0"
description = "Pearson and Spearman for every pair of columns in a CSV, with small-sample and divergence warnings."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[tool.setuptools]
py-modules = ["correlate"]
